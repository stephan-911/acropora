[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "acropora"
version = "1.0.0"
description = "Computing statistical solutions of nonlinear partial differential equations"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-2-Clause-Patent"
license-files = ["LICENSE"]
authors = [
  { name = "Stephan Simonis" },
]
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/stephan-911/acropora"
Paper = "https://doi.org/10.48550/arXiv.2605.25282"

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]
post = ["scipy", "matplotlib", "pot"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
